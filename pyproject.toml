[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-token-tracker"
dynamic = ["version"]
description = "Track token usage across AI tools (Claude Code, Codex CLI, Gemini CLI and any custom source) from local logs."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
license = { text = "MIT" }

[project.scripts]
ai-tokens = "ai_token_tracker.cli:main"

[project.gui-scripts]
ai-tokens-gui = "ai_token_tracker.gui:main"

[tool.setuptools.dynamic]
version = { attr = "ai_token_tracker.__version__" }
