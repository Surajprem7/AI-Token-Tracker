[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-token-tracker"
dynamic = ["version"]
description = "See how many tokens (and roughly how much money) your AI coding tools use, from their local logs."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
license = "MIT"

[project.optional-dependencies]
# Native app window instead of a browser tab (Edge WebView2 on Windows, WebKit on macOS),
# plus the tray icon on Windows and reading Zed's compressed threads.
app = ["pywebview>=5", "certifi", "zstandard",
       "pystray; sys_platform == 'win32'", "Pillow; sys_platform == 'win32'"]

[project.scripts]
ai-tokens = "ai_token_tracker.cli:main"

[project.gui-scripts]
ai-tokens-gui = "ai_token_tracker.gui:main"

[tool.setuptools.package-data]
ai_token_tracker = ["web/*", "data/*.json"]

[tool.setuptools.dynamic]
version = { attr = "ai_token_tracker.__version__" }
