<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Tokens</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Cpath d='M8 22V14M14 22V9M20 22v-6M26 22V12' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body class="widget">
<main class="w-main">
  <section class="w-limits" id="wLimits" hidden>
    <div class="w-label">Usage</div>
    <div id="wLimitRows"></div>
  </section>
  <section class="w-today">
    <div class="w-label">Today</div>
    <div class="w-big" id="wTokens">–</div>
    <div class="w-sub"><span id="wCost"></span></div>
    <div class="share-bar" id="wBar" aria-hidden="true"></div>
    <ul class="w-tools" id="wTools"></ul>
  </section>
  <section class="w-latest" id="wLatest" hidden>
    <div class="w-label">Latest session</div>
    <div class="w-title" id="wLatestTitle"></div>
    <div class="w-sub" id="wLatestSub"></div>
  </section>
  <footer class="w-foot">
    <span class="muted small" id="wUpdated"></span>
    <button class="text-btn" id="wOpen">Open dashboard</button>
  </footer>
</main>
<script src="widget.js"></script>
</body>
</html>
