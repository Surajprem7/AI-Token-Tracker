name: Build apps

# Run manually from the Actions tab, or push a tag like v1.0.0 to publish a release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Install build tools
        run: python -m pip install pyinstaller build
      - name: Python package (wheel)
        if: matrix.os == 'ubuntu-latest'
        run: python -m build --wheel --outdir dist
      - name: Standalone app
        shell: bash
        run: |
          pip install .
          pyinstaller --noconfirm --onefile --windowed --name AITokenTracker packaging/app.py
          pyinstaller --noconfirm --onefile --console --name ai-tokens packaging/cli.py
      - name: Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows-installer.iss
      - name: Collect files
        shell: bash
        run: |
          mkdir out
          case "${{ matrix.os }}" in
            windows-latest) cp dist/AITokenTracker-Setup.exe dist/AITokenTracker.exe dist/ai-tokens.exe out/ ;;
            macos-latest)   (cd dist && zip -qry ../out/AITokenTracker-macOS.zip AITokenTracker.app ai-tokens) ;;
            ubuntu-latest)  cp dist/*.whl out/ && tar -czf out/AITokenTracker-linux.tar.gz -C dist AITokenTracker ai-tokens ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: AITokenTracker-${{ matrix.os }}
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
