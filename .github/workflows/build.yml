name: Build apps

# Run manually from the Actions tab (tick "Publish a release" to publish the current
# version), or push a tag like v2.3.0. Installed apps update to the newest release.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release (tag v<version from __init__.py>)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    outputs:
      version: ${{ steps.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Version
        id: version
        shell: bash
        run: echo "version=$(PYTHONPATH=src python -c 'import ai_token_tracker as a; print(a.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Install build tools
        # Pinned: a new PyInstaller major version must not change the apps without us noticing.
        run: python -m pip install "pyinstaller==6.22.3" build certifi
      - name: Python package (wheel)
        if: matrix.os == 'ubuntu-latest'
        run: python -m build --wheel --outdir dist
      - name: Standalone app
        shell: bash
        run: |
          # Windows/macOS get a native app window (pywebview); Linux opens the dashboard in the browser.
          # certifi is bundled so "Update prices online" can check HTTPS certificates in the frozen app.
          COMMON="--noconfirm --collect-data ai_token_tracker --collect-data certifi"
          case "${{ matrix.os }}" in
            ubuntu-latest)
              pip install .
              pyinstaller $COMMON --onefile --windowed --name AITokenTracker packaging/app.py ;;
            macos-latest)
              pip install ".[app]"
              # A normal .app bundle (one-folder); PyInstaller is dropping one-file .app bundles.
              pyinstaller $COMMON --collect-all webview --windowed --name AITokenTracker \
                --osx-bundle-identifier io.github.surajprem7.aitokentracker packaging/app.py ;;
            windows-latest)
              pip install ".[app]"
              pyinstaller $COMMON --collect-all webview --onefile --windowed --name AITokenTracker packaging/app.py ;;
          esac
          pyinstaller $COMMON --onefile --console --name ai-tokens packaging/cli.py
      - name: Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = python -c "import ai_token_tracker; print(ai_token_tracker.__version__)"
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup compiler (ISCC.exe) not found" }
          & $iscc.FullName "/DAppVersion=$version" packaging\windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
      - name: Collect files
        shell: bash
        run: |
          mkdir out
          case "${{ matrix.os }}" in
            windows-latest) cp dist/AITokenTracker-Setup.exe dist/AITokenTracker.exe dist/ai-tokens.exe out/ ;;
            macos-latest)
              # Apple Silicon (M1 and later) build; Intel Macs can use the pip install instead.
              ditto -c -k --keepParent dist/AITokenTracker.app out/AITokenTracker-macOS-AppleSilicon.zip
              cp dist/ai-tokens out/ai-tokens-macos ;;
            ubuntu-latest)  cp dist/*.whl out/ && tar -czf out/AITokenTracker-linux.tar.gz -C dist AITokenTracker ai-tokens ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: AITokenTracker-${{ matrix.os }}
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # only this job publishes, and only for version tags
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', needs.build.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: AI Token Tracker ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', needs.build.outputs.version) }}
          make_latest: true
          generate_release_notes: true
          body: |
            **Download**
            - **Windows:** `AITokenTracker-Setup.exe` (installs for your user, no admin needed). Portable: `AITokenTracker.exe`.
            - **Mac (M1 or later):** `AITokenTracker-macOS-AppleSilicon.zip`. Unzip, move the app to Applications, then right-click → Open the first time.
            - **Any computer with Python:** `pip install "ai_token_tracker-<version>-py3-none-any.whl[app]"`, then `ai-tokens-gui`.

            Installed copies check for a new release every time they open and update themselves automatically.
            Windows may say "Windows protected your PC" because the app isn't code-signed: click More info → Run anyway.
          files: out/*
